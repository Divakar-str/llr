<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLR Portal - Extractor Wizard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f6f9;
        }

        .card {
            border-radius: 12px;
        }

        textarea {
            font-size: 14px;
            line-height: 1.6;
            resize: none;
        }

        .nav-pills .nav-link {
            color: #6c757d;
            font-weight: 600;
            border-radius: 8px;
        }

        .nav-pills .nav-link.active {
            background-color: #0d6efd;
            color: #fff;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🚗 LLR Portal</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">🏠 Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="extractor.html">📄 Data Extraction</a></li>
                    <li class="nav-item"><a class="nav-link" href="records.html">📋 Records </a></li>
                    <li class="nav-item"><a class="nav-link " href="report.html">📊 Reports</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">📈 Dashboard</a></li>
                    <li class="nav-item active"><a class="nav-link " href="print-engine.html">🖨️ Print
                            Console</a></li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container mb-3">
        <div class="card shadow-sm border-0 bg-white">
            <div class="card-body py-2 px-3">
                <ul class="nav nav-pills d-flex gap-2" id="extractorSteps">
                    <li class="nav-item"><button class="nav-link active" id="pill-step1" disabled>1. Paste PDF Text
                            Area</button></li>
                    <li class="nav-item"><button class="nav-link" id="pill-step2" disabled>2. Verify & Save Form
                            Fields</button></li>
                </ul>
            </div>
        </div>
    </div>

    <div class="container pb-5" id="viewContainer">
        <div id="step1View" class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">LLR Text Processing Engine</h5>
            </div>
            <div class="card-body">
                <label class="form-label fw-bold text-secondary mb-2">Paste Raw Copied LLR PDF Text Block</label>
                <textarea id="pdfText" class="form-control mb-3" rows="12"
                    placeholder="Paste raw string block details here..."></textarea>
                <div class="d-flex gap-2">
                    <button id="extractBtn" class="btn btn-primary px-4">Parse Data & Open Fields Form →</button>
                    <button id="clearBtn" class="btn btn-outline-secondary">Clear</button>
                </div>
            </div>
        </div>

        <div id="step2View" class="card shadow-sm border-0 d-none">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Verify Fields & Operational Configurations</h5>
            </div>
            <div class="card-body">
                <form id="llrVerificationForm" novalidate>

                    <h6 class="text-primary fw-bold border-bottom pb-2 mb-3">Core Credentials</h6>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6"><label class="form-label text-muted small fw-semibold">LLR
                                Number</label><input type="text" id="formLlrNumber" name="llr_number"
                                class="form-control"></div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-semibold">Fees Number</label>
                            <input type="text" id="formFeesNumber" name="fees_number" class="form-control">
                        </div>
                        <div class="col-md-4"><label class="form-label text-muted small fw-semibold">Fee Amount
                                (Rs.)</label><input type="text" id="formFee" name="fee" class="form-control"></div>
                        <div class="col-md-4"><label class="form-label text-muted small fw-semibold">Vehicle
                                Class</label><input type="text" id="formVehicleClass" name="vehicle_class"
                                class="form-control"></div>
                        <div class="col-md-4"><label class="form-label text-muted small fw-semibold">Blood
                                Group</label><input type="text" id="formBloodGroup" name="blood_group"
                                class="form-control"></div>
                    </div>

                    <h6 class="text-primary fw-bold border-bottom pb-2 mb-3">Personal & Family Demographics</h6>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6"><label class="form-label text-muted small fw-semibold">Applicant
                                Name</label><input type="text" id="formName" name="name" class="form-control"></div>
                        <div class="col-md-3"><label class="form-label text-muted small fw-semibold">Date of
                                Birth</label><input type="text" id="formDob" name="date_of_birth" class="form-control">
                        </div>
                        <div class="col-md-3"><label class="form-label text-muted small fw-semibold">Relative
                                Type</label><select id="formRelativeType" name="relative_type" class="form-select">
                                <option value="Father">Father</option>
                                <option value="Husband">Husband</option>
                            </select></div>
                        <div class="col-md-6"><label class="form-label text-muted small fw-semibold">Relative
                                Name</label><input type="text" id="formRelativeName" name="relative_name"
                                class="form-control"></div>

                        <div class="col-md-3"><label class="form-label text-dark small fw-bold">Mobile Number <span
                                    class="text-danger">*</span></label><input type="tel" id="formMobile"
                                name="mobile_number" class="form-control border-primary"
                                placeholder="10-digit primary tel" maxlength="10"></div>
                        <div class="col-md-3"><label class="form-label text-muted small fw-semibold">Emergency Mobile
                                (Optional)</label><input type="tel" id="formEmergencyMobile" name="emergency_mobile"
                                class="form-control" placeholder="Optional backup tel" maxlength="10"></div>
                    </div>

                    <h6 class="text-primary fw-bold border-bottom pb-2 mb-3">Addresses & Identifiers</h6>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6"><label class="form-label text-muted small fw-semibold">Present
                                Address</label><textarea id="formPresentAddress" name="present_address"
                                class="form-control" rows="2"></textarea></div>
                        <div class="col-md-6"><label class="form-label text-muted small fw-semibold">Permanent
                                Address</label><textarea id="formPermanentAddress" name="permanent_address"
                                class="form-control" rows="2"></textarea></div>
                        <div class="col-md-6"><label class="form-label text-muted small fw-semibold">Identification Mark
                                1</label><input type="text" id="formIdMark1" name="identification_mark_1"
                                class="form-control"></div>
                        <div class="col-md-6"><label class="form-label text-muted small fw-semibold">Identification Mark
                                2</label><input type="text" id="formIdMark2" name="identification_mark_2"
                                class="form-control"></div>
                    </div>

                    <h6 class="text-primary fw-bold border-bottom pb-2 mb-3">Validity & Driving Licence (DL) Status</h6>
                    <div class="row g-3 mb-4">
                        <div class="col-md-3"><label class="form-label text-muted small fw-semibold">LLR Issue
                                Date</label><input type="text" id="formIssueDate" name="issue_date"
                                class="form-control"></div>
                        <div class="col-md-3"><label class="form-label text-muted small fw-semibold">LLR Expiry
                                Date</label><input type="text" id="formExpiryDate" name="expiry_date"
                                class="form-control"></div>
                        <div class="col-md-3"><label class="form-label text-muted small fw-semibold">LLR Approved
                                Timestamp</label><input type="text" id="formApprovedDate" name="approved_date"
                                class="form-control"></div>

                        <div class="col-md-3">
                            <label class="form-label text-dark small fw-bold">DL Issued Status</label>
                            <select id="formDlIssued" name="dl_issued" class="form-select border-warning">
                                <option value="No">No (Pending LLR Period)</option>
                                <option value="Yes">Yes (DL Approved)</option>
                            </select>
                        </div>
                        <div class="col-md-4"><label class="form-label text-muted small fw-semibold">Permanent DL Number
                                (If issued)</label><input type="text" id="formDlNumber" name="dl_number"
                                class="form-control" placeholder="e.g. TN5220260000000"></div>
                    </div>

                    <hr>
                    <div class="d-flex justify-content-between">
                        <button type="button" id="backToStep1Btn" class="btn btn-outline-secondary">← Back to Paste
                            Area</button>
                        <button type="submit" class="btn btn-success px-4">Submit and Save to Database ✓</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="env.js"></script>
    <script src="./js/extractor.js"></script>
    <script src="./js/formHandler.js"></script>
</body>

</html>
