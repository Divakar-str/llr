<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLR Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: system-ui, -apple-system, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); width: 100%; max-width: 420px; padding: 2.5rem; }
        .btn-custom { background: #0f172a; color: #ffffff; border-radius: 12px; font-weight: 600; padding: 0.75rem; transition: background 0.2s; }
        .btn-custom:hover { background: #1e293b; color: #ffffff; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="fs-1 text-dark mb-2"><i class="bi bi-shield-lock-fill"></i></div>
            <h3 class="fw-bold text-dark">LLR Portal Access</h3>
            <p class="text-muted small">Enter your Cloudflare Worker credentials</p>
        </div>
        <form id="dedicatedLoginForm" onsubmit="handleDedicatedLogin(event)">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Username</label>
                <input type="text" id="usernameInput" class="form-control rounded-3 py-2" required placeholder="admin">
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary">Password</label>
                <input type="password" id="passwordInput" class="form-control rounded-3 py-2" required placeholder="••••••••">
            </div>
            <div id="errorAlert" class="alert alert-danger py-2 small d-none" role="alert">
                Invalid username or password.
            </div>
            <button type="submit" class="btn btn-custom w-100">Sign In to Dashboard</button>
        </form>
    </div>

    <!-- Load env.js before auth check -->
    <script src="env.js"></script>
    <script>
        const WORKER_URL = (typeof ENV !== 'undefined' && ENV.SHEET_API_URL) ? ENV.SHEET_API_URL : "";

        window.onload = function() {
            if (sessionStorage.getItem("authBasic")) { 
                window.location.href = "index.html"; 
            }
        };

        async function handleDedicatedLogin(event) {
            event.preventDefault();
            const user = document.getElementById("usernameInput").value.trim();
            const pass = document.getElementById("passwordInput").value.trim();
            const token = "Basic " + btoa(user + ":" + pass);

            try {
                const response = await fetch(`${WORKER_URL}?action=readAll`, { 
                    headers: { "Authorization": token } 
                });

                if (response.status === 401) { 
                    document.getElementById("errorAlert").classList.remove("d-none"); 
                    return; 
                }

                if (response.ok) { 
                    sessionStorage.setItem("authBasic", token); 
                    window.location.href = "index.html"; 
                } else { 
                    alert("Cloudflare server error."); 
                }
            } catch (err) { 
                alert("Network failure: Could not connect to Worker API."); 
            }
        }
    </script>
</body>
</html>
